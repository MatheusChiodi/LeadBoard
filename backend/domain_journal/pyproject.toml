[project]
name = "domain-journal"
version = "0.1.0"
description = "Dominio Journal: entrada, tag, relatorio, template e resumo."
requires-python = ">=3.12"
dependencies = ["shared-contracts", "shared-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_journal"]

[project.entry-points."leadboard.handlers"]
journal = "domain_journal.registry:handlers"

[tool.uv.sources]
shared-contracts = { workspace = true }
shared-storage = { workspace = true }
