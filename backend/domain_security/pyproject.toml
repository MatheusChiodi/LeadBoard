[project]
name = "domain-security"
version = "0.1.0"
description = "App Security, App Router e Http Client. Nao conhece dominio de negocio."
requires-python = ">=3.12"
dependencies = [
    "shared-contracts",
    "shared-storage",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_security"]

[tool.uv.sources]
shared-contracts = { workspace = true }
shared-storage = { workspace = true }
