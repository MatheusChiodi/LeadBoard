[project]
name = "domain-draw"
version = "0.1.0"
description = "Dominio Draw: diagramas de infraestrutura, versoes e compartilhamento."
requires-python = ">=3.12"
dependencies = ["shared-contracts", "shared-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_draw"]

[project.entry-points."leadboard.handlers"]
draw = "domain_draw.registry:handlers"

[tool.uv.sources]
shared-contracts = { workspace = true }
shared-storage = { workspace = true }
