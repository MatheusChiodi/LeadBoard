[project]
name = "leadboard-backend"
version = "0.1.0"
description = "LeadBoard — workspace raiz. Amarra os membros, nao contem codigo."
requires-python = ">=3.12"
dependencies = [
    "core-gateway",
    "domain-security",
    "domain-journal",
    "shared-contracts",
    "shared-storage",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core_gateway", "domain_*", "shared_*"]

[tool.uv.sources]
core-gateway = { workspace = true }
domain-security = { workspace = true }
domain-journal = { workspace = true }
shared-contracts = { workspace = true }
shared-storage = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "httpx>=0.28",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "core_gateway/src",
    "domain_security/src",
    "domain_journal/src",
    "shared_contracts/src",
    "shared_storage/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "RUF", "ANN", "S"]
# UP040: `type X = ...` (PEP 695) ainda tem suporte irregular no mypy para
# alias recursivo, que e exatamente o caso de JsonValue.
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
# S101: assert e a ferramenta do pytest. S105/S106: segredo literal em teste e o
# ponto — ele nao pode vir de ambiente ou o teste deixa de ser deterministico.
"**/tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Cumpre a Definition of Done da secao 8 no lugar certo: proibe `Any` no nosso
# codigo sem reclamar do `Any` que Pydantic e FastAPI usam internamente.
"typing.Any".msg = "Sem Any explicito (secao 8). Use `object`, um TypeVar ou um Protocol."

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolve anotacao em runtime. Mover `datetime` ou `date` para um bloco
# TYPE_CHECKING quebraria a validacao do modelo com NameError na primeira request
# — um erro que nenhum type checker acusa porque, para ele, o import existe.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic.RootModel"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.lint.isort]
known-first-party = [
    "core_gateway",
    "domain_security",
    "domain_journal",
    "shared_contracts",
    "shared_storage",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
# `disallow_any_explicit` fica DESLIGADO de proposito. Com Pydantic v2 ele acusa
# o `Any` das stubs de BaseModel e ConfigDict, nao o do nosso codigo — 19 falsos
# positivos que ensinariam a ignorar a saida do mypy. A regra da secao 8 ("sem
# Any explicito") e cumprida pelo ruff, que bane `typing.Any` no nosso fonte e
# nao ve o que a biblioteca faz por dentro.
mypy_path = [
    "core_gateway/src",
    "domain_security/src",
    "domain_journal/src",
    "shared_contracts/src",
    "shared_storage/src",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "core_gateway",
    "domain_security",
    "domain_journal",
    "shared_contracts",
    "shared_storage",
]
# --import-mode=importlib: sem ele, os `tests/` dos cinco membros virariam o
# mesmo pacote `tests` e a suite completa quebraria por colisao de nome —
# passando quando rodada um pacote por vez, que e a pior forma de falhar.
addopts = "-q --strict-markers --import-mode=importlib"
consider_namespace_packages = true
