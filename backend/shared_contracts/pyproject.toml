[project]
name = "shared-contracts"
version = "0.1.0"
description = "Contratos compartilhados: Flag, RequestContext, portas e DTOs. Nao importa ninguem."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_contracts"]
