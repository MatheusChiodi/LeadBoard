[project]
name = "domain-tools"
version = "0.1.0"
description = "Dominio Tools: as tres ferramentas que tocam rede, mais uso pessoal."
requires-python = ">=3.12"
dependencies = ["shared-contracts", "shared-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_tools"]

[project.entry-points."leadboard.handlers"]
tools = "domain_tools.registry:handlers"

[tool.uv.sources]
shared-contracts = { workspace = true }
shared-storage = { workspace = true }
